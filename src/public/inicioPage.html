<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Cooperadora</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #0070f3; color: white; border: none; cursor: pointer; font-size: 16px; }
    .error { color: red; margin-bottom: 15px; }
  </style>
</head>
<body>

  <h2>Iniciar Sesión</h2>
  <div id="errorMsg" class="error"></div>

  <form id="loginForm">
    <div class="field">
      <label>Correo / Usuario:</label>
      <input type="text" id="correo" required placeholder="ejemplo@cooperadora.edu">
    </div>
    
    <div class="field">
      <label>Contraseña:</label>
      <input type="password" id="password" required value="1234567">
    </div>

    <button type="submit">Ingresar</button>
  </form>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const correo = document.getElementById('correo').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Guardar sesión en el navegador
          localStorage.setItem('usuario', JSON.stringify(data.usuario));

          // Redirección por ROL
          if (data.usuario.rol === 'ADMIN') {
            window.location.href = '/gestionPage.html';
          } else {
            window.location.href = '/inicioPage.html';
          }
        } else {
          errorMsg.textContent = data.error || 'Credenciales inválidas';
        }
      } catch (err) {
        errorMsg.textContent = 'Error de conexión con el servidor';
      }
    });
  </script>
</body>
</html>
